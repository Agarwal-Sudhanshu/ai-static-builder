<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Theme Landing Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        header {
            background: linear-gradient(90deg, #1E1E1E, #004CFF);
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 40px;
        }
        p {
            font-size: 18px;
            margin: 10px 0;
        }
        .cta-button {
            background: #004CFF;
            color: #ffffff;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .cta-button:hover {
            background: #007BFF;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #1E1E1E;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to Our Dark Themed Site</h1>
    <p>Your gateway to a stylish experience.</p>
    <button class="cta-button">Get Started</button>
</header>

<main>
    <section>
        <h2>Features</h2>
        <p>Explore amazing features that make us stand out.</p>
    </section>
</main>

<footer>
    <p>&copy; 2023 Your Company. All rights reserved.</p>
</footer>

</body>
</html>
