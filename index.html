<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: white;
            color: black;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            position: relative;
        }

        h1 {
            font-size: 3em;
            overflow: hidden;
            white-space: nowrap;
            animation: slide-in 2s ease forwards;
        }

        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .cta {
            margin-top: 30px;
            font-size: 1.5em;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1em;
            text-decoration: none;
            color: white;
            background-color: black;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: gray;
        }

        section {
            padding: 40px 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }
            .cta {
                font-size: 1.2em;
            }
            .button {
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
            }
            .cta {
                font-size: 1em;
            }
            .button {
                padding: 10px 20px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Innovative Solutions for Your Business</h1>
        <div class="cta">Get started now</div>
        <a href="#services" class="button">Learn More</a>
    </header>
    <section id="services">
        <h2>Our Services</h2>
        <p>We offer a wide range of services to help you succeed.</p>
    </section>
</body>
</html>
