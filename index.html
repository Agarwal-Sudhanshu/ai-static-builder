<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Fintech Landing Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #001f3f;
            color: #ffffff;
            display: flex;
            height: 100vh;
        }
        .left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
        }
        .right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cta-button {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.7);
        }
        .cta-button:hover {
            box-shadow: 0 0 25px rgba(0, 123, 255, 1);
        }
        .illustration-placeholder {
            width: 100%;
            height: 100%;
            background-color: #3a4750;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 24px;
            border-radius: 10px;
        }
        @media (max-width: 768px) {
            .left, .right {
                flex: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="left">
        <h1>Welcome to Our Fintech Solutions</h1>
        <p>Transform the way you manage your finances with our intuitive platform that offers seamless experiences and powerful tools.</p>
        <button class="cta-button">Get Started</button>
    </div>
    <div class="right">
        <div class="illustration-placeholder">Illustration Placeholder</div>
    </div>
</body>
</html>
