<!DOCTYPE html>
<html>
<head>
  <title>AI Site Generator</title>
</head>
<body>
  <h2>AI Website Builder</h2>
  <textarea 
  id="prompt" 
  rows="6" 
  style="width:600px; padding:10px; font-size:14px;"
  placeholder="Enter your prompt here..."
></textarea>
  <button onclick="generate()">Generate</button>


<h3>Git Rollback</h3>
<select id="commitList"></select>
<button onclick="gitRollback()">Rollback</button>

<script>
async function loadCommits() {
  const res = await fetch("/commits");
  const commits = await res.json();

  const select = document.getElementById("commitList");
  select.innerHTML = "";

  commits.forEach(c => {
    const option = document.createElement("option");
    option.value = c.hash;
    option.textContent = `${c.hash} - ${c.message} (${c.date})`;
    select.appendChild(option);
  });
}

async function gitRollback() {
  const hash = document.getElementById("commitList").value;

  await fetch("/git-rollback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hash })
  });

  alert("Rollback complete. Refresh GitHub Pages.");
}

loadCommits();
</script>

<script>
async function loadVersions() {
  const res = await fetch("/versions");
  const versions = await res.json();

  const select = document.getElementById("versionList");
  select.innerHTML = "";

  versions.forEach(v => {
    const option = document.createElement("option");
    option.value = v;
    option.textContent = v;
    select.appendChild(option);
  });
}

async function rollback() {
  const version = document.getElementById("versionList").value;

  await fetch("/rollback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ version })
  });

  alert("Rollback complete. Refresh live site.");
}

loadVersions();
</script>
  <script>
  async function generate() {
    const prompt = document.getElementById("prompt").value.trim();

    if (!prompt) {
      alert("Please enter a prompt.");
      return;
    }

    await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });

    alert("Site Updated! Refresh GitHub Page in 30 seconds.");
  }
</script>
</body>
</html>
